[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wave-part-dual"
version = "0.1.0"
description = "An open-ended computer vision and machine learning practice project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel>=6.29,<8",
    "jupyterlab>=4.4,<5",
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "opencv-python>=4.10,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
